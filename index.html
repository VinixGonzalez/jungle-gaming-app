<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140d0a" />
    <meta
      name="description"
      content="Descubra e colecione NFTs selecionados de artistas e criadores digitais na Kurio."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource-variable/roboto-mono/files/roboto-mono-latin-wght-normal.woff2"
    />
    <link
      id="detail-artwork-preload"
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/src/shared/assets/artworks/emerald-ape-mobile.webp"
      media="not all"
    />
    <link
      id="home-card-preload"
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/src/shared/assets/artworks/golden-beat-mobile.webp"
      media="not all"
    />
    <script>
      if (window.location.pathname === "/") {
        document.getElementById("home-card-preload").media =
          "(max-width: 1279px)"
      } else if (window.location.pathname.startsWith("/nfts/")) {
        document.getElementById("detail-artwork-preload").media =
          "(max-width: 1279px)"
      }
    </script>
    <style>
      html,
      body {
        min-height: 100%;
        background: #140d0a;
      }

      body {
        margin: 0;
      }

      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-content: center;
        gap: 12px;
        color: #d28a4c;
        font: 600 14px/1.25 ui-monospace, monospace;
        text-align: center;
      }

      #root:not(:empty) + .app-boot {
        display: none;
      }

      .app-boot::before {
        width: 28px;
        height: 28px;
        margin-inline: auto;
        border: 2px solid rgb(210 138 76 / 25%);
        border-top-color: #d28a4c;
        border-radius: 999px;
        animation: app-boot-spin 800ms linear infinite;
        content: "";
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(1turn);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot::before {
          animation: none;
        }
      }
    </style>
    <title>Kurio | Jungle Gaming</title>
  </head>
  <body>
    <div id="root"></div>
    <div aria-live="polite" class="app-boot" role="status">
      Carregando...
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
